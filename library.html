<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library — SAPTHA</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<script src="script.js"></script>
<script>
const u = requireAuth();
renderHeader("library.html");
</script>

<section>
<div class="container">
  <h3>E-Library</h3>
  <p class="lead">Coordinator-uploaded textbooks & reference materials.</p>

  <div id="coord"></div>
  <ul class="notes-list" id="list"></ul>
</div>
</section>

<script>
const COLLECTION = "library";
let books = [];

async function loadItems(){
  const raw = await apiList(COLLECTION);
  books = raw.map(item => ({ id: item.id, ...item.data }));
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function fmtSize(bytes){
  return (bytes/1024/1024).toFixed(2) + " MB";
}

function downloadDataURL(data, name){
  const safeData = safeDataURL(data);
  if(!safeData){
    alert("This file cannot be downloaded because its data URL is invalid or unsupported.");
    return;
  }
  const a = document.createElement("a");
  a.href = safeData;
  a.download = String(name || "download");
  a.click();
}

async function deleteBook(id){
  if(!confirm("Delete this book?")) return;
  await apiDelete(COLLECTION, id);
  await loadItems();
  render();
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  const visibleBooks = books.slice().reverse();

  if(visibleBooks.length === 0){
    list.innerHTML = '<div class="empty">No books uploaded yet.</div>';
    return;
  }

  visibleBooks.forEach(n=>{
    list.insertAdjacentHTML("beforeend",`
      <li class="card" style="margin-bottom:12px;padding:12px">
        <div>
          <strong>${escapeHTMLValue(n.name)}</strong><br>
          <span class="file-meta">${escapeHTMLValue(n.by)} · ${escapeHTMLValue(n.date)} · ${fmtSize(n.size)}</span>
        </div>

        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn sm" type="button">Download</button>
        </div>
      </li>
    `);
    list.lastElementChild.querySelector("button").addEventListener("click", () => {
      downloadDataURL(n.data, n.name);
    });
  });
}

loadItems().then(render).catch(err => alert(err.message));
renderFooter();
</script>

</body>
</html>
